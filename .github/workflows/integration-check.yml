name: self-hosted-integration-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, home]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: echo "runner=$RUNNER_NAME work=$GITHUB_WORKSPACE" && cat /etc/os-release | head -2
      - run: pg_isready -h localhost -p 5432
      - run: |
          printf 'FROM alpine:3.20\nRUN echo built-on-$RUNNER_NAME > /marker\n' > Dockerfile.check
          docker build -f Dockerfile.check -t integration-check:local .
          docker run --rm integration-check:local cat /marker
      - run: docker run --rm -v "$PWD:/mnt" alpine:3.20 ls /mnt | head -3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && aws --version && psql --version
